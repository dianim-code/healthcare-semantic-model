# Run once:  uvx pre-commit install
# Run all:   uvx pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(csv|md)$
      - id: end-of-file-fixer
        # Power BI Desktop writes PBIR JSON without a final newline and TMDL with an extra blank line,
        # and rewrites them on every Save: leave its files as it writes them.
        exclude: ^(HospitalBeds\.(Report|SemanticModel)/|HospitalBeds\.pbip$)|\.csv$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.csv$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Desktop writes the parameter values set in "Edit parameters" into expressions.tmdl on Save.
  # Those values are a local path (drive, user name) or a Databricks workspace (host, warehouse,
  # schema with the user name), so the commit must carry the placeholders and the CSV source instead.
  - repo: local
    hooks:
      - id: sample-data-folder-placeholder
        name: Source parameters keep their placeholders (CSV source)
        language: pygrep
        files: (^|/)expressions\.tmdl$
        entry: 'expression (SampleDataFolder|DatabricksHost|DatabricksHttpPath|DatabricksSchema) = "(?!<SET ME)|expression DataSource = "(?!CSV")'
        args: [--multiline]
